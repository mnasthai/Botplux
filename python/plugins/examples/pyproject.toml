[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plux-example-plugins"
version = "0.1.0"
description = "Independent examples for the Plux plugin API"
requires-python = ">=3.11"
dependencies = ["plux-framework>=0.1,<0.2"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["plux_plugins.*"]
namespaces = true

[tool.setuptools.package-data]
"plux_plugins.examples" = ["content/*.toml", "assets/*.png"]
